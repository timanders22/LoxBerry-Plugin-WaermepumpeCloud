[AUTHOR]
NAME=Waermepumpe Cloud LoxBerry Plugin Authors
EMAIL=waermepumpe-loxberry@users.noreply.github.com

[PLUGIN]
VERSION=0.9.0
NAME=waermepumpe
FOLDER=waermepumpe
TITLE=Waermepumpe Cloud - myUplink, Onecta, MELCloud

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide 0.9.0 lauten, wird niemandem etwas angeboten; sobald der
# Zweig eine hoehere Fassung fuehrt, greift die Aktualisierung von selbst.
#
# Adressen NIE auf ein fremdes Repository richten: LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-WaermepumpeCloud/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-WaermepumpeCloud/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=raspberry,x86
CUSTOM_LOGLEVELS=true
