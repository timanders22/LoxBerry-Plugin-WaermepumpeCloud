[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Bei jedem Release VERSION und BEIDE Adressen auf den neuen
# Tag anpassen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Zwei Adressen, zwei verschiedene Quellen - das ist die haeufigste Fehlerstelle:
# die plugin.cfg liest DIESE Datei aus dem ZWEIG master, das ARCHIVEURL unten
# zieht aber aus dem TAG. Wer hier etwas aendert, ohne den Tag mitzuziehen,
# liefert an neue Installationen weiter den alten Stand aus.
#
# Die prerelease.cfg fuehrt dieselbe Fassung und dieselben Adressen.

VERSION=0.9.9
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-WaermepumpeCloud/archive/refs/tags/v0.9.9.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-WaermepumpeCloud/releases/tag/v0.9.9
