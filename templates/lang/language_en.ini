T_WERT = "latest"

[LOX]
H_TITEL = "Loxone integration"
WW_KOMMENTAR = "Domestic hot water boost on/off — independent of SG Ready"
S1 = "<b>Choose the path.</b> For the measured values MQTT is the standard route — the plugin pushes them as soon as they arrive. If you prefer to pull, use the virtual HTTP input from step 3; both at once is possible but unnecessary."
S2 = "<b>Enter the subscription in the MQTT gateway.</b>"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b>"
S3 = "<b>Create virtual inputs.</b> One virtual HTTP input with this address:"
S3_HINWEIS = "The address returns one line of the form <span class='sm-mono'>WP;OK=1;STUFE=2;…</span>. <b>Calling it does not trigger a cloud request</b> — it only reads the cached state. So an input that polls too often can neither drain the Daikin daily budget nor get the MELCloud account locked out."
T_TITEL = "Title"
T_ART = "Type"
T_BEDEUTUNG = "Meaning"
ANALOG = "analog"
DIGITAL = "digital"
S4 = "<b>Send SG Ready.</b> One virtual output per state, with this address:"
S4_KLEMMEN = "If you would rather drive the two terminals separately — which is how it is wired at the appliance — use this instead:"
S4_WW = "<b>Domestic hot water boost</b> — a virtual output of its own, independent of SG Ready. The most common case in summer: charge the cylinder from PV surplus and leave the heating circuit alone. In the import file it is called <span class='sm-mono'>WP_WW_BOOST</span> and carries both on and off commands:"
S4_WW_NICHT = "<b>Domestic hot water boost:</b> %s offers no documented way for this. The output is therefore missing from the import file — a block that only ever gets refusals would be worse than none."
S4_SELFTEST = "<b>To check without switching:</b> this address replies with <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> and does not touch the heat pump. Use it after a token change to verify that the addresses in the Miniserver are still valid:"
S5 = "<b>Failure detection.</b> Virtual inputs keep their last value; the app then looks perfectly normal even though nothing has arrived for hours. That is why the status line carries <span class='sm-mono'>WP_ALTER</span> in seconds. Set the alarm threshold <b>well above the polling interval</b>, otherwise a single missed pass reports an outage that is none."
H_VORLAGE = "Create everything at once"
VORLAGE_TEXT = "Two files: the inputs with all measured values, and the four outputs for SG Ready. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing — imported twice means duplicate blocks. The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
K_VORLAGE_EIN = "Create inputs (VI)"
K_VORLAGE_AUS = "Create SG Ready outputs (VQ)"
H_BAUSTEINE = "Complete block list to rebuild"
BAUSTEINE_TEXT = "Work through it from top to bottom and the function is rebuilt. The blocks are found in Loxone Config via the block search (F5)."
T_BAUSTEIN = "Block (type)"
T_NAME = "Name (suggestion)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Connect inputs to"
BAUSTEINE_ERLAEUTERUNG = "<b>On #3:</b> set the delay to at least three times the polling interval. With Daikin that is quickly 30 minutes — which is right, not sluggish: at 200 calls a day a skipped pass is normal.<br><b>On #4:</b> the notification block only fires on the transition from off to on. Never wire several sources directly to its input — merge them through an OR first, otherwise a permanently active source swallows all the others.<br><b>On #7 and #8:</b> only ever set <b>one</b> of the four outputs to 1 at a time. The plugin does take the last state sent, but if two outputs are driven at once you cannot say afterwards which one won.<br><b>On #8:</b> the plugin already limits the block duration. The block here is the second safeguard, in Loxone — it also applies when the LoxBerry itself is down."
H_GEGENPROBE = "Cross-check"
GEGENPROBE = "Press <i>Fetch status line</i> on the <i>Test</i> tab and compare the numbers with those in the manufacturer's app. If they match, open the virtual input in Loxone Config — the same line must appear there. Only then wire up the blocks."

