KEIN_AUTOSTART = "The MQTT gateway is not set to autostart (System → MQTT Gateway). Values are sent, but probably nobody is listening."
H_ABO = "Enter the subscription in the MQTT gateway"
ABO_TEXT = "For the values to arrive at the Miniserver, this subscription must be entered in the MQTT gateway (System → MQTT Gateway → Subscriptions):"
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> It is the single most common cause of failure."
