VAILLANT_TEXT = "myVAILLANT has <b>no public API</b>. Login uses the same credentials as the app. Everything this plugin does for it comes from the open source library <span class='sm-mono'>myPyllant</span> — none of it is guessed, but Vaillant can change it at any time. If you can, create a second account with sharing in the app and store that one here instead of your main account."
