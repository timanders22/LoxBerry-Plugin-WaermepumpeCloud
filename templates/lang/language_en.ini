L_DHW = "Hot water circuit"
H_DHW = "The index of the domestic hot water circuit. Vaillant counts these from <b>255</b>, not from 0 — that is not a typo. If the hot water boost has no effect, this index is the first suspect."
L_VETO_STUNDEN = "Duration of the quick veto (hours)"
H_VETO = "Raising is done through the <i>quick veto</i> of the system, not through the manual mode setpoint. The difference is a safeguard: the quick veto expires by itself. If the Miniserver hangs while a raise is active, the system falls back on its own after this time instead of heating the house indefinitely."
L_COP = "Calculate efficiency"
H_COP = "Fetches the energy counters of the system and divides heat generated by electrical energy consumed. At most once per hour, because every counter series costs its own request and the daily figures barely move anyway. If the system delivers only one of the two series, <b>nothing</b> is calculated — an invented number would be worse than none."
L_COP_TAGE = "Period of the efficiency figure (days)"
H_COP_TAGE = "30 days smooth out outliers and still show change. 1 day is the daily figure, 365 comes close to the seasonal performance factor."
COP_GRUND = "Efficiency: %s"
