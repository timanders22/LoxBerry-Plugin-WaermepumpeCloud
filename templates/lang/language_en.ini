SG_EMS = "emulated, real with relays"
GRENZE_VAILLANT = "Not promised by Vaillant — may change at any time. <b>Minimum interval 300 seconds</b>: the sensoCOMFORT only reports new values every five minutes anyway."
GRENZE_EMS = "<b>No cloud, no account, no rate limit.</b> It needs a gateway on the EMS bus (for example from BBQKees). Reading needs nothing at all; writing needs an access token from the gateway web interface."
EMS_TEXT = "The gateway sits on <b>your</b> network and speaks HTTP. So there is no login and no daily budget here — just an address. The access token is only needed for <b>writing</b>; the display works without it. By the way, a Bosch heat pump reports itself on the bus as <span class='sm-mono'>boiler</span>, not as <span class='sm-mono'>heatpump</span> – that name belongs to a different module."
L_EMS_URL = "Address of the gateway"
H_EMS_URL = "With <span class='sm-mono'>http://</span> in front, for example <span class='sm-mono'>http://ems-esp.local</span> or <span class='sm-mono'>http://192.168.1.40</span>. The name only works if mDNS runs on your network — the fixed address is the more reliable route."
L_EMS_TOKEN = "Access token (bearer token)"
H_EMS_TOKEN = "In the gateway web interface under <b>Settings → Security → Manage Users</b>, key icon next to the user with admin rights. It does not expire. It is stored in a separate file with permissions 0600, not in the configuration — the interface only shows its length."
L_EMS_TOKEN_LOESCHEN = "Delete access token"
L_EMS_HC = "Heating circuit"
H_EMS_HC = "Which heating circuit of the thermostat is meant (hc1 to hc8). On a system with a single circuit, leave it at 1."
L_EMS_THERMOSTAT = "Also read thermostat values"
H_EMS_THERMOSTAT = "Room temperature and room setpoint live on the thermostat, not on the heat pump. Without a room unit, switch this off — two fields will then be missing, and that is not a fault."
L_EMS_SG_ART = "How SG Ready is implemented"
O_EMS_NACHBILDUNG = "Emulated through the interface (recommended)"
O_EMS_KLEMMEN = "Real terminals via two GPIO of the gateway"
H_EMS_SG_ART = "The heat pump's SG Ready terminals <b>cannot</b> be set over the EMS bus — the gateway can only read them. The emulation instead switches heating off, or raises the room temperature. To drive the terminals for real you need two relays on the gateway."
EMS_KLEMMEN_WARNUNG = "<b>Only with additional hardware.</b> Two GPIO must be configured as <i>Digital out</i> in the gateway web interface and wired through a relay or optocoupler each to input 1 and input 4 of the heat pump. The gateway manufacturer states this explicitly: the boards are not designed for it, adding anything breaks EMC compliance, and a relay never belongs directly on the pin."
L_EMS_GPIO1 = "GPIO for input 1"
L_EMS_GPIO4 = "GPIO for input 4"
H_EMS_GPIO = "0 means not used. The pattern is the one from the standard — 1:0 blocked, 0:0 normal, 0:1 switch-on recommendation, 1:1 start command."
FEHLER_EMS_URL = "The address „%s“ is incomplete. It must start with http:// or https://."
FEHLER_EMS_TOKEN = "That does not look like an access token. A JWT consists of three parts separated by dots. The previous value is kept."
FEHLER_EMS_GPIO = "For real terminals both GPIO numbers must be set. Otherwise the switch is on and does nothing."
FEHLER_EMS_GPIO_GLEICH = "Both terminals point to the same GPIO. That could only represent two of the four states."

[SG]
H_TITEL = "SG Ready"
ERKLAERUNG = "SG Ready is originally a matter of two relay contacts on the appliance. Four states, four terminal positions. This plugin takes the desired state from Loxone and applies it through the cloud — <b>really, where the manufacturer knows SG Ready; emulated, where it does not.</b>"
T_STUFE = "State"
T_KLEMMEN = "Terminals"
T_BEDEUTUNG = "Meaning per the standard"
T_HIER = "What actually happens here"
STUFE1 = "Blocked"
STUFE2 = "Normal operation"
STUFE3 = "Switch-on recommendation"
STUFE4 = "Forced start"
WIRKUNG_MYUPLINK_1 = "Register 6008 to 0 — the heat pump knows this state itself."
WIRKUNG_MYUPLINK_2 = "Register 6008 to 1."
WIRKUNG_MYUPLINK_3 = "Register 6008 to 2 (cheap energy)."
WIRKUNG_MYUPLINK_4 = "Register 6008 to 3 (surplus)."
WIRKUNG_ONECTA_1 = "<i>Emulated:</i> heating circuit off (<span class='sm-mono'>onOffMode=off</span>). That is not a utility block, it is simply off."
WIRKUNG_ONECTA_2 = "<i>Emulated:</i> heating circuit on, setpoint back to the base value."
WIRKUNG_ONECTA_3 = "<i>Emulated:</i> heating circuit on, setpoint raised by the configured amount."
WIRKUNG_ONECTA_4 = "<i>Emulated:</i> setpoint raised by the larger amount, optionally hot-water boost."
WIRKUNG_MELCLOUD_1 = "<i>Emulated:</i> unit off (<span class='sm-mono'>Power=false</span>). That is not a utility block, it is simply off."
WIRKUNG_MELCLOUD_2 = "<i>Emulated:</i> unit on, zone 1 setpoint back to the base value."
WIRKUNG_MELCLOUD_3 = "<i>Emulated:</i> unit on, zone 1 setpoint raised by the configured amount."
WIRKUNG_MELCLOUD_4 = "<i>Emulated:</i> larger raise, optionally <span class='sm-mono'>ForcedHotWaterMode</span>."
NACHBILDUNG_WARNUNG = "<b>With %s, SG Ready is emulated.</b> This manufacturer's cloud has no SG Ready input. „Blocked“ therefore means <i>off</i> here — and <i>off</i> is not the same as the utility block a heat pump knows itself: it does not continue frost protection and legionella cycles in the same way. Anyone who needs a real block cannot avoid the two terminals on the appliance."
ECHT_HINWEIS = "With Nibe, SG Ready is set <b>for real</b>: register 3032 enables control through the interface, 6008 carries the state. The <i>Test</i> tab checks whether your device actually offers these two points — older firmware does not."
L_EIN = "Accept SG Ready from Loxone"
H_EIN = "Without this tick the endpoint accepts no states and switches nothing. Values are still read."
L_SPERRE = "Block at most (minutes)"
H_SPERRE = "<b>This limit is not a convenience but a safeguard.</b> SG Ready allows at most two hours of blocking. If the Miniserver hangs while the block is active, the heating would otherwise stand still indefinitely — in January that is not a cosmetic issue. After this time the plugin falls back to normal operation by itself and writes it to the log."
H_NACHBILDUNG = "Emulation"
H_NACHBILDUNG_TEXT = "These values apply only where SG Ready is emulated — that is, with Daikin and Mitsubishi. With Nibe they have no effect."
L_BASIS = "Base setpoint (°C)"
H_BASIS = "The setpoint to return to after a raise. Leave empty: the plugin then remembers the value the heat pump holds at the first poll during normal operation. <b>Without a base value nothing is raised</b> — otherwise the raise would keep accumulating on every pass."
L_ANHEBUNG_3 = "Raise on switch-on recommendation (K)"
L_ANHEBUNG_4 = "Raise on forced start (K)"
L_WWBOOST = "Bring hot water along on forced start"
H_WWBOOST = "Hot water is the most convenient store in the house: heating it on PV surplus costs nothing and lasts until the evening. In the other states the boost is switched off again."
ZULETZT = "Last set: state %d on %s — %s"
H_WIRKUNG = "Did it have an effect?"
WIRKUNG_TEXT = "With four of the five manufacturers SG Ready is <b>emulated</b> — whether the emulation achieves anything on <i>this</i> system cannot be known from the outside. This table therefore claims nothing: on every state change it records what flow temperature and power draw were <b>before</b>, and adds the same values %d minutes later. The judgement stays with you."
WIRKUNG_LEER = "No state change recorded yet. The first entry appears as soon as Loxone or a button on the <i>Test</i> tab requests a different state."
WIRKUNG_HILFE = "An upward arrow on the flow temperature together with a rising power draw suggests the system accepted the request. If both stay unchanged, the emulation does nothing on this system — then only the two terminals on the device will help. A missing value means the system did not report it in that round, not that it is zero."
W_ZEIT = "When"
W_STUFE = "State"
W_GESCHRIEBEN = "What was written"
W_VORLAUF = "Flow before → after"
W_LEISTUNG = "Power before → after"
W_LAEUFT = "still being measured"
W_UEBERHOLT = "superseded, a new state came in between"
GESPEICHERT = "SG Ready settings saved."
WIRKUNG_VAILLANT_1 = "<i>Emulated — and deliberately restrained:</i> a running raise is ended, nothing else is sent. The system can be switched off through this interface, but <i>off</i> is not a utility lockout: frost protection and legionella cycles do not continue in the same way. Whoever really wants to block, uses the two terminals on the appliance."
WIRKUNG_VAILLANT_2 = "<i>Emulated:</i> a running quick veto and the hot water boost are ended. The system returns to its time program."
WIRKUNG_VAILLANT_3 = "<i>Emulated:</i> quick veto to base setpoint plus the small raise, for the configured duration."
WIRKUNG_VAILLANT_4 = "<i>Emulated:</i> quick veto to base setpoint plus the large raise, optionally with the hot water boost. This is the state in which PV surplus goes into the cylinder."
WIRKUNG_EMSESP_1 = "<i>Emulated:</i> heating off (<span class='sm-mono'>boiler.heatingactivated=false</span>). This is not a utility block: with a real block the heat pump knows its own maximum duration and restarts by itself — here that depends on the configured maximum and therefore on the LoxBerry. With the terminals it would be the real thing."
WIRKUNG_EMSESP_2 = "<i>Emulated:</i> heating on, room setpoint back to the remembered base value."
WIRKUNG_EMSESP_3 = "<i>Emulated:</i> heating on, room setpoint raised by the small increment (<span class='sm-mono'>thermostat.hc&lt;n&gt;.seltemp</span>). What is raised is the <b>room</b> temperature, not the flow temperature — the system derives that from its own heating curve."
WIRKUNG_EMSESP_4 = "<i>Emulated:</i> room setpoint raised by the large increment, plus the one-time hot water charge if selected (<span class='sm-mono'>boiler.onetime</span>). The one-time charge ends by itself once the stop temperature is reached — so it is not cancelled at stage 2 or 3."

