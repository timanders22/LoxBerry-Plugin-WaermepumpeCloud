RAEUMEN_OFFEN = "Unter %s stehen noch %d zurückbehaltene Themen im Broker (%s). Das Präfix bleibt vorgemerkt; die Deinstallation räumt es mit ab."
RAEUMEN_UNBEKANNT = "Unter %s wurden %d zurückbehaltene Themen mit leerer Nutzlast gesendet; der Broker ließ sich nicht befragen. Das Präfix bleibt vorgemerkt; die Deinstallation räumt es mit ab."
