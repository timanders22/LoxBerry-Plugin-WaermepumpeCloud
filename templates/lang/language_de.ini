WAS_IST_DAS = "<b>Bindet moderne Wärmepumpen an den Loxone Miniserver an – über die Cloud des Herstellers oder, bei Bosch und seinen Marken, über ein Gateway im eigenen Netz.</b> Ein Abruf per Cron holt die Werte bei myUplink (Nibe), Daikin Onecta, MELCloud (Mitsubishi), myVAILLANT oder EMS-ESP und gibt sie per MQTT an Loxone weiter. In der Gegenrichtung nimmt das Plugin den SG-Ready-Zustand von Loxone entgegen und setzt ihn an der Wärmepumpe um – echt, wo der Hersteller SG Ready kennt, sonst nachgebildet. Auf Wunsch sagt es Anmeldefehler, ausbleibende Werte und Störungen über die gemeinsame Sprachausgabe an (ab Werk aus)."

