[LOX]
H_TITEL = "Einbindung in Loxone"
S1 = "<b>Weg festlegen.</b> Für die Messwerte ist MQTT der Regelweg &mdash; das Plugin schiebt sie, sobald sie da sind. Wer lieber holt, nimmt den virtuellen HTTP-Eingang aus Schritt 3; beides gleichzeitig ist möglich, aber unnötig."
S2 = "<b>Abo im MQTT-Gateway eintragen.</b>"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b>"
S3 = "<b>Virtuelle Eingänge anlegen.</b> Ein virtueller HTTP-Eingang mit dieser Adresse:"
S3_HINWEIS = "Die Adresse liefert eine Zeile in der Form <span class='sm-mono'>WP;OK=1;STUFE=2;&hellip;</span>. <b>Der Aufruf löst keinen Abruf bei der Cloud aus</b> &mdash; er liest nur den Zwischenstand. Ein zu häufig fragender Eingang kann also weder das Daikin-Tagesbudget leeren noch das MELCloud-Konto aussperren."
T_TITEL = "Titel"
T_ART = "Art"
T_BEDEUTUNG = "Bedeutung"
ANALOG = "analog"
DIGITAL = "digital"
S4 = "<b>SG Ready senden.</b> Ein virtueller Ausgang je Zustand, mit dieser Adresse:"
S4_KLEMMEN = "Wer die beiden Klemmen einzeln führen will &mdash; so hängt es am Gerät ja auch &mdash;, nimmt statt dessen:"
S5 = "<b>Ausfallerkennung.</b> Virtuelle Eingänge behalten ihren letzten Wert; in der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr kommt. Deshalb liefert die Statuszeile <span class='sm-mono'>WP_ALTER</span> in Sekunden mit. Die Schwelle für die Meldung <b>deutlich über den Abruftakt</b> legen, sonst meldet ein einzelner verpasster Durchlauf einen Ausfall, der keiner ist."
H_VORLAGE = "Alles auf einmal anlegen"
VORLAGE_TEXT = "Zwei Dateien: die Eingänge mit allen Messwerten, und die vier Ausgänge für SG Ready. <b>Hinweis:</b> Loxone Config legt beim Import neu an und überschreibt nichts &mdash; zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_VORLAGE_EIN = "Eingänge erzeugen (VI)"
K_VORLAGE_AUS = "SG-Ready-Ausgänge erzeugen (VQ)"
H_BAUSTEINE = "Komplette Baustein-Liste zum Nachbauen"
BAUSTEINE_TEXT = "Von oben nach unten abarbeiten, dann ist die Funktion nachgebaut. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (F5)."
T_BAUSTEIN = "Baustein (Typ)"
T_NAME = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Eingänge verbinden mit"
BAUSTEINE_ERLAEUTERUNG = "<b>Zu #3:</b> Die Verzögerung mindestens auf das Dreifache des Abruftakts legen. Bei Daikin sind das schnell 30 Minuten &mdash; das ist richtig so, nicht träge: bei 200 Aufrufen am Tag ist ein ausgelassener Durchlauf normal.<br><b>Zu #4:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang &mdash; erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu #7 und #8:</b> Immer nur <b>einen</b> der vier Ausgänge gleichzeitig auf 1 setzen. Das Plugin nimmt zwar den zuletzt gesendeten Zustand, aber wer zwei Ausgänge gleichzeitig führt, kann hinterher nicht sagen, welcher gewonnen hat.<br><b>Zu #8:</b> Die Begrenzung der Sperre gibt es im Plugin bereits. Der Baustein hier ist die zweite Sicherung in Loxone &mdash; sie greift auch dann, wenn der LoxBerry selbst steht."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE = "Im Reiter <i>Test</i> auf <i>Statuszeile holen</i> drücken und die Zahlen mit denen in der Hersteller-App vergleichen. Stimmen sie, danach in Loxone Config den virtuellen Eingang öffnen &mdash; dort muss dieselbe Zeile stehen. Erst dann die Bausteine verdrahten."

