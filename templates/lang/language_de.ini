[SG]
H_TITEL = "SG Ready"
ERKLAERUNG = "SG Ready ist im Ursprung eine Sache von zwei Relaiskontakten am Gerät. Vier Zustände, vier Klemmenstellungen. Dieses Plugin nimmt den gewünschten Zustand von Loxone entgegen und setzt ihn über die Cloud um &mdash; <b>echt, wo der Hersteller SG Ready kennt, nachgebildet, wo er es nicht kennt.</b>"
T_STUFE = "Zustand"
T_KLEMMEN = "Klemmen"
T_BEDEUTUNG = "Bedeutung nach Norm"
T_HIER = "Was hier tatsächlich geschieht"
STUFE1 = "Sperre"
STUFE2 = "Normalbetrieb"
STUFE3 = "Einschaltempfehlung"
STUFE4 = "Anlaufbefehl"
WIRKUNG_MYUPLINK_1 = "Register 6008 auf 0 &mdash; die Wärmepumpe kennt diesen Zustand selbst."
WIRKUNG_MYUPLINK_2 = "Register 6008 auf 1."
WIRKUNG_MYUPLINK_3 = "Register 6008 auf 2 (günstiger Strom)."
WIRKUNG_MYUPLINK_4 = "Register 6008 auf 3 (Überschuss)."
WIRKUNG_ONECTA_1 = "<i>Nachgebildet:</i> Heizkreis aus (<span class='sm-mono'>onOffMode=off</span>). Das ist keine EVU-Sperre, sondern schlicht aus."
WIRKUNG_ONECTA_2 = "<i>Nachgebildet:</i> Heizkreis ein, Sollwert auf den Grundwert."
WIRKUNG_ONECTA_3 = "<i>Nachgebildet:</i> Heizkreis ein, Sollwert um die eingestellte Anhebung höher."
WIRKUNG_ONECTA_4 = "<i>Nachgebildet:</i> Sollwert um die größere Anhebung höher, wahlweise Warmwasser-Zwang."
WIRKUNG_MELCLOUD_1 = "<i>Nachgebildet:</i> Gerät aus (<span class='sm-mono'>Power=false</span>). Das ist keine EVU-Sperre, sondern schlicht aus."
WIRKUNG_MELCLOUD_2 = "<i>Nachgebildet:</i> Gerät ein, Sollwert Zone 1 auf den Grundwert."
WIRKUNG_MELCLOUD_3 = "<i>Nachgebildet:</i> Gerät ein, Sollwert Zone 1 um die eingestellte Anhebung höher."
WIRKUNG_MELCLOUD_4 = "<i>Nachgebildet:</i> größere Anhebung, wahlweise <span class='sm-mono'>ForcedHotWaterMode</span>."
NACHBILDUNG_WARNUNG = "<b>Bei %s ist SG Ready nachgebildet.</b> Die Cloud dieses Herstellers kennt keinen SG-Ready-Eingang. „Sperre“ heißt hier deshalb <i>aus</i> &mdash; und <i>aus</i> ist nicht dasselbe wie die EVU-Sperre, die eine Wärmepumpe selbst kennt: sie fährt Frostschutz und Legionellenschaltung nicht in gleicher Weise weiter. Wer eine echte Sperre braucht, kommt an den beiden Klemmen am Gerät nicht vorbei."
ECHT_HINWEIS = "Bei Nibe wird SG Ready <b>echt</b> gesetzt: Register 3032 schaltet die Bedienung über die Schnittstelle frei, 6008 trägt den Zustand. Der Reiter <i>Test</i> sieht nach, ob Ihr Gerät diese beiden Punkte wirklich anbietet &mdash; ältere Firmware tut das nicht."
L_EIN = "SG Ready aus Loxone annehmen"
H_EIN = "Ohne diesen Haken nimmt der Endpunkt keine Zustände entgegen und schaltet nichts. Die Werte werden trotzdem gelesen."
L_SPERRE = "Sperre höchstens (Minuten)"
H_SPERRE = "<b>Diese Grenze ist kein Komfort, sondern eine Sicherung.</b> SG Ready sieht für die Sperre höchstens zwei Stunden vor. Bleibt der Miniserver hängen, während gerade gesperrt ist, stünde die Heizung sonst unbegrenzt still &mdash; im Januar ist das kein Schönheitsfehler. Nach dieser Zeit fällt das Plugin von selbst auf Normalbetrieb zurück und schreibt es ins Protokoll."
H_NACHBILDUNG = "Nachbildung"
H_NACHBILDUNG_TEXT = "Diese Werte gelten nur, wo SG Ready nachgebildet wird &mdash; also bei Daikin und Mitsubishi. Bei Nibe sind sie wirkungslos."
L_BASIS = "Grundsollwert (°C)"
H_BASIS = "Der Sollwert, auf den nach einer Anhebung zurückgestellt wird. Leer lassen: dann merkt sich das Plugin beim ersten Abruf im Normalbetrieb den Wert, den die Wärmepumpe gerade hat. <b>Ohne Grundwert wird nicht angehoben</b> &mdash; sonst addierte sich die Anhebung bei jedem Durchlauf weiter auf."
L_ANHEBUNG_3 = "Anhebung bei Einschaltempfehlung (K)"
L_ANHEBUNG_4 = "Anhebung bei Anlaufbefehl (K)"
L_WWBOOST = "Bei Anlaufbefehl das Warmwasser mitziehen"
H_WWBOOST = "Warmwasser ist der bequemste Speicher im Haus: bei PV-Überschuss aufheizen kostet nichts und hält bis zum Abend. Bei den anderen Zuständen wird der Zwang wieder abgeschaltet."
ZULETZT = "Zuletzt gesetzt: Zustand %d am %s &mdash; %s"
GESPEICHERT = "SG-Ready-Einstellungen gespeichert."
WIRKUNG_VAILLANT_1 = "<i>Nachgebildet &mdash; und bewusst zurückhaltend:</i> eine laufende Anhebung wird beendet, sonst wird <b>nichts</b> gesendet. Die Anlage lässt sich über diese Schnittstelle zwar ausschalten, aber <i>aus</i> ist keine EVU-Sperre: Frostschutz und Legionellenschaltung laufen dann nicht in gleicher Weise weiter. Wer wirklich sperren will, nimmt die beiden Klemmen am Gerät."
WIRKUNG_VAILLANT_2 = "<i>Nachgebildet:</i> eine laufende Schnellabweichung und die Warmwasser-Aufheizung werden beendet. Die Anlage regelt wieder nach ihrem Zeitprogramm."
WIRKUNG_VAILLANT_3 = "<i>Nachgebildet:</i> Schnellabweichung auf Grundsollwert plus kleine Anhebung, für die eingestellte Laufzeit."
WIRKUNG_VAILLANT_4 = "<i>Nachgebildet:</i> Schnellabweichung auf Grundsollwert plus große Anhebung, dazu wahlweise die Warmwasser-Schnellaufheizung. Das ist der Zustand, in dem PV-Überschuss in den Speicher geht."

