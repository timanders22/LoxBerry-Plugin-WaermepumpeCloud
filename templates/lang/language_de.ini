WIRKUNG_MYUPLINK_2 = "Register 6008 auf 1."
WIRKUNG_MYUPLINK_3 = "Register 6008 auf 2 (günstiger Strom)."
WIRKUNG_MYUPLINK_4 = "Register 6008 auf 3 (Überschuss)."
WIRKUNG_ONECTA_1 = "<i>Nachgebildet:</i> Heizkreis aus (<span class='sm-mono'>onOffMode=off</span>). Das ist keine EVU-Sperre, sondern schlicht aus."
WIRKUNG_ONECTA_2 = "<i>Nachgebildet:</i> Heizkreis ein, Sollwert auf den Grundwert."
WIRKUNG_ONECTA_3 = "<i>Nachgebildet:</i> Heizkreis ein, Sollwert um die eingestellte Anhebung höher."
WIRKUNG_ONECTA_4 = "<i>Nachgebildet:</i> Sollwert um die größere Anhebung höher, wahlweise Warmwasser-Zwang."
WIRKUNG_MELCLOUD_1 = "<i>Nachgebildet:</i> Gerät aus (<span class='sm-mono'>Power=false</span>). Das ist keine EVU-Sperre, sondern schlicht aus."
WIRKUNG_MELCLOUD_2 = "<i>Nachgebildet:</i> Gerät ein, Sollwert Zone 1 auf den Grundwert."
WIRKUNG_MELCLOUD_3 = "<i>Nachgebildet:</i> Gerät ein, Sollwert Zone 1 um die eingestellte Anhebung höher."
WIRKUNG_MELCLOUD_4 = "<i>Nachgebildet:</i> größere Anhebung, wahlweise <span class='sm-mono'>ForcedHotWaterMode</span>."
NACHBILDUNG_WARNUNG = "<b>Bei %s ist SG Ready nachgebildet.</b> Die Cloud dieses Herstellers kennt keinen SG-Ready-Eingang. <b>Was bei „Sperre“ wirklich geschieht, steht in der Tabelle darunter — es ist nicht bei jedem Hersteller dasselbe.</b> Wo abgeschaltet wird, ist <i>aus</i> nicht dasselbe wie die EVU-Sperre, die eine Wärmepumpe selbst kennt: sie fährt Frostschutz und Legionellenschaltung nicht in gleicher Weise weiter. Wer eine echte Sperre braucht, kommt an den beiden Klemmen am Gerät nicht vorbei."
ECHT_HINWEIS = "Bei Nibe wird SG Ready <b>echt</b> gesetzt: Register 3032 schaltet die Bedienung über die Schnittstelle frei, 6008 trägt den Zustand. Der Reiter <i>Test</i> sieht nach, ob Ihr Gerät diese beiden Punkte wirklich anbietet — ältere Firmware tut das nicht."
L_EIN = "SG Ready aus Loxone annehmen"
H_EIN = "Ohne diesen Haken nimmt der Endpunkt keine Zustände entgegen und schaltet nichts. Die Werte werden trotzdem gelesen."
L_SPERRE = "Sperre höchstens (Minuten)"
H_SPERRE = "<b>Diese Grenze ist kein Komfort, sondern eine Sicherung.</b> SG Ready sieht für die Sperre höchstens zwei Stunden vor. Bleibt der Miniserver hängen, während gerade gesperrt ist, stünde die Heizung sonst unbegrenzt still — im Januar ist das kein Schönheitsfehler. Nach dieser Zeit fällt das Plugin von selbst auf Normalbetrieb zurück und schreibt es ins Protokoll."
H_NACHBILDUNG = "Nachbildung"
H_NACHBILDUNG_TEXT = "Diese Werte gelten überall dort, wo SG Ready nachgebildet wird — also bei Daikin, Mitsubishi, Vaillant und dem EMS-Gateway. Nur bei Nibe (myUplink) sind sie wirkungslos, dort gibt es die beiden Register wirklich."
L_BASIS = "Grundsollwert (°C)"
H_BASIS = "Der Sollwert, auf den nach einer Anhebung zurückgestellt wird. Leer lassen: dann merkt sich das Plugin beim ersten Abruf im Normalbetrieb den Wert, den die Wärmepumpe gerade hat. Ein <b>geleertes</b> Feld setzt einen gemerkten Wert zurück, das Plugin lernt ihn dann neu. <b>Ohne Grundwert wird nicht angehoben</b> — sonst addierte sich die Anhebung bei jedem Durchlauf weiter auf. Normalbetrieb (Zustand 2) geht auch ohne ihn."
L_ANHEBUNG_3 = "Anhebung bei Einschaltempfehlung (K)"
L_ANHEBUNG_4 = "Anhebung bei Anlaufbefehl (K)"
L_WWBOOST = "Bei Anlaufbefehl das Warmwasser mitziehen"
H_WWBOOST = "Warmwasser ist der bequemste Speicher im Haus: bei PV-Überschuss aufheizen kostet nichts und hält bis zum Abend. Bei den anderen Zuständen wird der Zwang wieder abgeschaltet."
ZULETZT = "Zuletzt gesetzt: Zustand %d am %s — %s"
H_WIRKUNG = "Hat es gewirkt?"
WIRKUNG_TEXT = "Bei vier der fünf Hersteller ist SG Ready <b>nachgebildet</b> — ob die Nachbildung an <i>dieser</i> Anlage etwas bewirkt, kann von außen niemand wissen. Diese Tabelle behauptet deshalb nichts: sie hält bei jedem Zustandswechsel fest, wie Vorlauf und Leistungsaufnahme <b>vorher</b> waren, und trägt %d Minuten später dieselben Werte nach. Das Urteil bleibt bei Ihnen."
WIRKUNG_LEER = "Noch kein Zustandswechsel aufgezeichnet. Der erste Eintrag entsteht, sobald Loxone oder ein Knopf im Reiter <i>Test</i> einen anderen Zustand anfordert."
WIRKUNG_HILFE = "Ein Pfeil nach oben beim Vorlauf und eine steigende Leistungsaufnahme sprechen dafür, dass die Anlage den Wunsch angenommen hat. Bleibt beides unverändert, tut die Nachbildung an dieser Anlage nichts — dann helfen nur die beiden Klemmen am Gerät. Kein Wert heißt: die Anlage hat ihn in dieser Runde nicht geliefert, nicht dass er null wäre."
W_ZEIT = "Wann"
W_STUFE = "Zustand"
W_GESCHRIEBEN = "Was geschrieben wurde"
W_VORLAUF = "Vorlauf vorher → nachher"
W_LEISTUNG = "Leistung vorher → nachher"
W_LAEUFT = "wird noch gemessen"
W_UEBERHOLT = "überholt, dazwischen kam ein neuer Zustand"
GESPEICHERT = "SG-Ready-Einstellungen gespeichert."
WIRKUNG_VAILLANT_1 = "<i>Nachgebildet — und bewusst zurückhaltend:</i> eine laufende Anhebung wird beendet, sonst wird <b>nichts</b> gesendet. Die Anlage lässt sich über diese Schnittstelle zwar ausschalten, aber <i>aus</i> ist keine EVU-Sperre: Frostschutz und Legionellenschaltung laufen dann nicht in gleicher Weise weiter. Wer wirklich sperren will, nimmt die beiden Klemmen am Gerät."
WIRKUNG_VAILLANT_2 = "<i>Nachgebildet:</i> eine laufende Schnellabweichung und die Warmwasser-Aufheizung werden beendet. Die Anlage regelt wieder nach ihrem Zeitprogramm."
WIRKUNG_VAILLANT_3 = "<i>Nachgebildet:</i> Schnellabweichung auf Grundsollwert plus kleine Anhebung, für die eingestellte Laufzeit."
WIRKUNG_VAILLANT_4 = "<i>Nachgebildet:</i> Schnellabweichung auf Grundsollwert plus große Anhebung, dazu wahlweise die Warmwasser-Schnellaufheizung. Das ist der Zustand, in dem PV-Überschuss in den Speicher geht."
WIRKUNG_EMSESP_1 = "<i>Nachgebildet:</i> Heizbetrieb aus (<span class='sm-mono'>boiler.heatingactivated=false</span>). Das ist keine EVU-Sperre: die Wärmepumpe kennt bei einer echten Sperre ihre Höchstdauer und läuft danach von selbst wieder an — hier hängt das an der eingestellten Höchstdauer und damit am LoxBerry. Mit den Klemmen wäre es die echte Sperre."
WIRKUNG_EMSESP_2 = "<i>Nachgebildet:</i> Heizbetrieb ein, Raumsollwert zurück auf den gemerkten Grundwert."
WIRKUNG_EMSESP_3 = "<i>Nachgebildet:</i> Heizbetrieb ein, Raumsollwert um die kleine Anhebung höher (<span class='sm-mono'>thermostat.hc&lt;n&gt;.seltemp</span>). Angehoben wird die <b>Raum</b>temperatur, nicht die Vorlauftemperatur — die rechnet die Anlage mit ihrer eigenen Heizkurve daraus."
WIRKUNG_EMSESP_4 = "<i>Nachgebildet:</i> Raumsollwert um die große Anhebung höher, dazu wahlweise die Warmwasser-Einmalladung (<span class='sm-mono'>boiler.onetime</span>). Die Einmalladung läuft von selbst aus, sobald die Stopptemperatur erreicht ist — sie wird deshalb bei Stufe 2 und 3 nicht abgebrochen."
L_ANHEBUNG_MAX = "Anhebung höchstens (Minuten)"
H_ANHEBUNG_MAX = "<b>Auch die Anhebung (Zustand 3 und 4) hat eine Höchstdauer.</b> Bleibt der Miniserver hängen, während angehoben ist, liefe die Wärmepumpe sonst unbegrenzt angehoben. Nach dieser Zeit fällt das Plugin von selbst auf Normalbetrieb zurück und schreibt es ins Protokoll; fordert Loxone danach wieder an, wird wieder angehoben. Ab Werk derselbe Wert wie die Sperre. Bei myVAILLANT endet die Anhebung schon früher, wenn die Schnellabweichung abläuft — der Zustand meldet dann 2."

[MQTT]
ABO_V1_DATEI = "<b>Das Plugin trägt das Abo selbst ein.</b> Es schreibt die Themengruppe in <span class='sm-mono'>config/plugins/waermepumpe/mqtt_subscriptions.cfg</span>, und das MQTT&#8209;Gateway liest diese Datei und abonniert daraus. Unter <i>System → MQTT Gateway → Abonnements</i> ist nichts von Hand einzutragen; ein zusätzlicher Eintrag dort schadet nicht."
ABO_SCHREIBFEHLER = "Die Abo-Datei mqtt_subscriptions.cfg ließ sich nicht schreiben — das Gateway abonniert die neue Themengruppe dann nicht."
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_TEXT = "Die Themengruppe dieses Plugins lautet:"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> ohne diesen Eintrag kommt am Miniserver nichts an. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den Subscriptions, einzutragen ist nichts."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Subscriptions</i> erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht."
ABO_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt. Die Zeile gehört unter <i>System → MQTT Gateway</i> in den Reiter <i>Abonnements</i> (Überschrift <i>MQTT Subscriptions</i>); danach speichern."
H_ABO = "Das Abo im MQTT-Gateway"
H_THEMEN = "Veröffentlichte Themen"
H_TITEL = "MQTT"
KEIN_ABSCHNITT = "In der <span class='sm-mono'>general.json</span> von LoxBerry gibt es keinen MQTT-Abschnitt. Das MQTT-Gateway ist Teil des Systems und wird unter System → MQTT Gateway eingeschaltet — es ist kein Plugin."
KEIN_AUTOSTART = "Das MQTT-Gateway steht nicht auf Autostart (System → MQTT Gateway). Es wird gesendet, aber vermutlich hört niemand zu."
OK = "Das MQTT-Gateway ist eingerichtet, UDP-Eingang %d."
