SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "Im Plugin Reiter „%s“ den Hersteller wählen, die Zugangsdaten eintragen und speichern; im Reiter „%s“ „%s“ und „%s“ drücken. Erst danach die Vorlagen erzeugen – die Ausgänge enthalten die Warmwasser-Zwangsladung nur, wenn der gewählte Hersteller sie kann."
S1_SCHRITT2 = "Reiter „%s“: Haken „%s“ setzen (ab Werk an) und die Tabelle lesen – sie sagt, was „Sperre“ bei Ihrem Hersteller wirklich tut. Bei Daikin, Mitsubishi und EMS-ESP einen Grundsollwert eintragen oder einmal Normalbetrieb laufen lassen; ohne ihn wird nicht angehoben."
S1_SCHRITT3 = "Oben in diesem Reiter, Abschnitt „%s“: „%s“ und „%s“ drücken. Die Adresse im Kopf prüfen: unter diesem Namen muss der Miniserver den LoxBerry erreichen."
S1_SCHRITT4 = "In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren → %s; Peripherie → Virtuelle Ausgänge → Vorlage importieren → %s. Jede Datei nur EINMAL einlesen (zweimal ergibt doppelte Bausteine). Für die Einschaltempfehlung (Nr. 31–41) außerdem die Vorlage „Spotpreis aWATTar“ des Plugins Spotpreis aWATTar einlesen (siehe Hinweise) – wer sie schon hat, nicht noch einmal."
S1_SCHRITT5 = "Neue Seite „WaermepumpeCloud“ anlegen. Aus „%s“ %s auf die Seite ziehen, aus „%s“ alle fünf Befehle, aus „Spotpreis aWATTar“ SPOT_RANK. Die Ausfallmeldung (Nr. 3, 4 und 43) kommt auf eine eigene Seite (Abschnitt „%s“)."
S1_SCHRITT6 = "Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „In Visualisierung verwenden“ an): Schalter „Sperrsignal Netzbetreiber (eigene Quelle)“, „Warmwasser jetzt laden“, „Günstigen Strom nutzen“ (Eingabeart Schalter, Startwert aus); Tasten „WP 2 h sperren“, „Sperre beenden“, „WP Anlauf 1 h“ (Eingabeart Taster); analog „PV-Leistung (eigene Quelle)“. Wer „Netzleistung (eigene Quelle)“ und die beiden Eingänge „Speicher 1“ schon im Projekt hat, zieht sie ein zweites Mal auf die Seite; sonst ebenso analog anlegen."
S1_SCHRITT7 = "Energiemanager setzen (Baustein-Suche F5). Im Eigenschaftsfenster die Verbraucher anlegen, Namen wie in der Tabelle: Verbraucher 1 „Wärmepumpe“, Verbraucher 2 „Warmwasser“, je 2 kW (eigene Leistung eintragen). Der Ausgang OL1 heißt in Config L1: L1 → „WP Anlauf“, L2 → „Warmwasser laden“."
S1_SCHRITT8 = "Die übrigen Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. ODER und UND haben je zwei Eingänge. Negierte Eingänge: Rechtsklick auf den Eingang → „Negieren“."
S1_SCHRITT9 = "Status-Bausteine (Nr. 2 und Nr. 42): Die Zeilen stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt. Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein."
S1_SCHRITT10 = "Speichern und in den Miniserver übertragen. Gegenprobe: in der App „WP 2 h sperren“ drücken – „SG Ready Wunsch“ zeigt „Loxone fordert Sperre“ und „WP Betriebszustand“ nach höchstens einem Abruftakt „Sperre“; „Sperre beenden“ – beide zeigen wieder Normalbetrieb."
S1_SCHRITT11 = "Eigene Quellen: die Leitung vom eigenen Sperrkontakt an Nr. 14 (Eingang I1) statt des Schalters Nr. 12; eigene Netz-, PV- und Speicherwerte an Nr. 16, 18, 20 und 22. Ohne Speicher Nr. 20–22 weglassen."
S1_H1 = "Vorrang: Sperre vor Anlauf vor Einschaltempfehlung vor Normalbetrieb. Immer nur ein Zustand ist angefordert; „SG Ready Wunsch“ zeigt, welcher, und daneben, was die Wärmepumpe meldet."
S1_H2 = "Das Plugin beendet eine Sperre und eine Anhebung nach 120 min von selbst (Reiter „%s“, „%s“ und „%s“); Nr. 8 ist die zweite Sicherung in Loxone und greift auch, wenn der LoxBerry steht. Der Auffrischtakt (Nr. 29) fordert eine laufende Anhebung alle 15 min neu an; ein unveränderter Zustand kostet keinen Cloud-Aufruf."
S1_H3 = "Bei myVAILLANT tut „Sperre“ bewusst nichts außer eine Anhebung zu beenden; eine echte Sperre geht nur über die Klemmen am Gerät (bei der aroTHERM plus der Multifunktionseingang)."
S1_H4 = "„Warmwasser jetzt laden“ endet, sobald der Schalter aus ist. Der Normalbetrieb (Nr. 11) beendet bei myVAILLANT auch eine laufende Warmwasser-Aufheizung – nach einer Anhebung kann der Speicher also früher aufhören als gewollt. Bei Nibe fehlt %s in der Vorlage – dann Nr. 23–25 weglassen."
S1_H5 = "Einschaltempfehlung: SPOT_RANK kommt aus der Vorlage „Spotpreis aWATTar“ des Plugins Spotpreis aWATTar (dort „Vorlage für Loxone Config erzeugen“, Datei VI_spotpreis.xml; im Musterprojekt liegt sie als VI_spotpreis_awattar.xml im Ordner vorlagen – dort Adresse und DEIN_TOKEN anpassen). Ohne Spotpreis-Plugin die Leitung vom eigenen Preisrang an Nr. 32 und 33 legen. „Günstigen Strom nutzen“ ist ab Werk aus."
S1_H6 = "Die günstigen Stunden (Nr. 33, 6 von 24) und die Leistung im Energiemanager sind Beispielwerte; an Tarif und Anlage anpassen."
S3_SCHRITT1 = "Vorlage wie auf Seite „WaermepumpeCloud“ (kein zweiter Import)."
S3_SCHRITT2 = "Neue Seite „WaermepumpeCloud Ausfall“ anlegen. Aus „%s“ %s auf die Seite ziehen."
S3_SCHRITT3 = "Die Benachrichtigung „WP Meldung“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste, und auf die Seite ziehen."
S3_SCHRITT4 = "Schwellwertschalter „WP Ausfall“ und Einschaltverzögerung „WP Ausfall bestätigt“ über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ verbinden."
S3_SCHRITT5 = "Speichern und übertragen. Gegenprobe: im Plugin Reiter „%s“ die Zeile „%s“ lesen – kommen die Abrufe durch, bleibt „WP Meldung“ still."
S3_H1 = "Die Nummern 3, 4 und 43 gehören zur Liste der Seite „WaermepumpeCloud“ und bleiben deshalb so; im Musterprojekt stehen die drei Bausteine auf dieser eigenen Seite."
S3_H2 = "Wer den Abruftakt über 300 s stellt, setzt Nr. 3 auf dreimal den neuen Takt."
S3_H3 = "Ein Benachrichtigungs-Baustein meldet nur beim Wechsel von Aus auf Ein und bekommt genau eine Quelle; weitere Meldungen erst über ein ODER zusammenführen."
S3_H4 = "Die Einschaltverzögerung (Nr. 43) blendet kurze Ausschläge beim Abholen des Eingangs aus. „WP LoxBerry antwortet nicht“ auf Seite „WaermepumpeCloud Werte“ meldet, wenn der LoxBerry selbst schweigt."
S2_SCHRITT1 = "Vorlage wie auf Seite „WaermepumpeCloud“ (kein zweiter Import)."
S2_SCHRITT2 = "Neue Seite „WaermepumpeCloud Werte“ anlegen. Aus „%s“ die 24 Eingänge der Liste ziehen (alle außer %s; %s ist die zweite Instanz)."
S2_SCHRITT3 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „WP LoxBerry antwortet nicht“, „Wärmepumpe Betriebshinweis“, „Arbeitszahl niedrig“, Texte wie in der Liste, und auf die Seite ziehen."
S2_SCHRITT4 = "Die übrigen Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. ODER und UND haben je zwei Eingänge."
S2_SCHRITT5 = "Status-Bausteine (Nr. 5, 15, 22, 28 und 40): Die Zeilen stehen in der Spalte „%s“ und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt. Nr. 15 mit „+“ auf sechs Eingänge erweitern, Nr. 22 und Nr. 28 auf fünf – Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein."
S2_SCHRITT6 = "Am Eingang %s „Statistik“ einschalten (Eigenschaft des Eingangs)."
S2_SCHRITT7 = "Speichern und übertragen. Gegenprobe: im Plugin Reiter „%s“ „%s“ drücken – die Zahlen müssen mit den Eingängen in Loxone übereinstimmen; „Verbindung zur Wärmepumpe“ zeigt „in Ordnung“."
S2_H1 = "Was Ihr Hersteller nicht liefert, bleibt 0. Welche Felder kommen, zeigt der Reiter „%s“ („%s“). Die Status zeigen dafür einen eigenen Text statt einer falschen 0; die Meldungen „taktet“ und „Arbeitszahl niedrig“ schweigen ohne Daten."
S2_H2 = "Verdichterstarts zählt das Plugin nur im Abruftakt – kürzere Läufe fehlen. Wer genau zählen will, legt den Verdichterkontakt an einen Digitaleingang des Miniservers."
S2_H3 = "Die Analogwertvalidierung (Nr. 7) prüft nur mit der Konstante 1 an En; sie meldet, wenn der LoxBerry selbst schweigt – „WP Meldung“ auf der ersten Seite meldet, wenn die Cloud schweigt."
S2_H3_EN = "Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S2_H4 = "Schwellen (10 min, 10 K, 2,5) sind Beispielwerte für eine Luft-Wasser-Wärmepumpe mit Fußbodenheizung; der Fachbetrieb kennt die richtigen Werte der eigenen Anlage."
