[LOX]
H_TITEL = "Einbindung in Loxone"
WW_KOMMENTAR = "Warmwasser-Zwangsladung ein/aus — unabhängig von SG Ready"
S1 = "<b>Weg festlegen.</b> Für die Messwerte ist MQTT der Regelweg — das Plugin schiebt sie, sobald sie da sind. Wer lieber holt, nimmt den virtuellen HTTP-Eingang aus Schritt 3; beides gleichzeitig ist möglich, aber unnötig."
S2 = "<b>Das Abo im MQTT-Gateway.</b> Die Themengruppe dieses Plugins lautet:"
S3 = "<b>Virtuelle Eingänge anlegen.</b> Ein virtueller HTTP-Eingang mit dieser Adresse:"
S3_HINWEIS = "Die Adresse liefert eine Zeile in der Form <span class='sm-mono'>WP;OK=1;STUFE=2;…</span>. <b>Der Aufruf löst keinen Abruf bei der Cloud aus</b> — er liest nur den Zwischenstand. Ein zu häufig fragender Eingang kann also weder das Daikin-Tagesbudget leeren noch das MELCloud-Konto aussperren. Solange noch <b>nie</b> Werte kamen, antwortet sie mit <b>HTTP 503</b> und nennt den Grund (<span class='sm-mono'>GRUND=NOCH_KEINE_DATEN;FEHLER=…</span>) — Loxone zeigt den Eingang dann als nicht erreichbar, statt eine erfundene Zahl einzulesen."
T_TITEL = "Titel"
T_ART = "Art"
T_BEDEUTUNG = "Bedeutung"
ANALOG = "analog"
DIGITAL = "digital"
S4 = "<b>SG Ready senden.</b> Ein virtueller Ausgang je Zustand, mit dieser Adresse:"
S4_KLEMMEN = "Wer die beiden Klemmen einzeln führen will — so hängt es am Gerät ja auch —, nimmt statt dessen:"
S4_WW = "<b>Warmwasser-Zwangsladung</b> — ein eigener virtueller Ausgang, unabhängig von SG Ready. Im Sommer der häufigste Fall: Speicher mit PV-Überschuss laden, Heizkreis in Ruhe lassen. In der Importdatei heißt er <span class='sm-mono'>WP_WW_BOOST</span> und trägt Ein- und Ausbefehl:"
S4_WW_NICHT = "<b>Warmwasser-Zwangsladung:</b> %s bietet dafür keinen belegten Weg an. Der Ausgang fehlt deshalb in der Importdatei — ein Baustein, der nur Absagen erntet, wäre schlimmer als keiner."
S4_SELFTEST = "<b>Zum Prüfen, ohne zu schalten:</b> diese Adresse antwortet mit <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> und fasst die Wärmepumpe nicht an. Damit lässt sich nach einem Token-Wechsel prüfen, ob die Adressen im Miniserver noch stimmen:"
S5 = "<b>Ausfallerkennung.</b> Virtuelle Eingänge behalten ihren letzten Wert; in der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr kommt. Deshalb liefert die Statuszeile <span class='sm-mono'>WP_ALTER</span> in Sekunden mit (-1 = noch nie Daten), und <span class='sm-mono'>WP_OK</span> geht auf 0, sobald der letzte erfolgreiche Abruf älter als das Dreifache des Abruftakts ist. Über MQTT gibt es dafür das Lebenszeichen <span class='sm-mono'>status/ts</span> (Zeitpunkt des letzten Erfolgs) und <span class='sm-mono'>status/zaehler</span> (wechselt jede Minute). Die Schwelle für eine eigene Meldung <b>deutlich über den Abruftakt</b> legen, sonst meldet ein einzelner verpasster Durchlauf einen Ausfall, der keiner ist."
H_VORLAGE = "Alles auf einmal anlegen"
VORLAGE_TEXT = "Zwei Dateien: die Eingänge mit allen Messwerten, und die Ausgänge für SG Ready. <b>Hinweis:</b> Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_VORLAGE_EIN = "Eingänge erzeugen (VI)"
K_VORLAGE_AUS = "SG-Ready-Ausgänge erzeugen (VQ)"
H_BAUSTEINE = "Komplette Baustein-Liste zum Nachbauen"
BAUSTEINE_TEXT = "Von oben nach unten abarbeiten, dann ist die Funktion nachgebaut. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (F5)."
T_BAUSTEIN = "Baustein (Typ)"
T_NAME = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Eingänge verbinden mit"
BAUSTEINE_ERLAEUTERUNG = "<b>Zu #3:</b> Die Verzögerung mindestens auf das Dreifache des Abruftakts legen. Bei Daikin sind das schnell 30 Minuten — das ist richtig so, nicht träge: bei 200 Aufrufen am Tag ist ein ausgelassener Durchlauf normal.<br><b>Zu #4:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang — erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu #7 und #8:</b> Immer nur <b>einen</b> der vier Ausgänge gleichzeitig auf 1 setzen. Das Plugin nimmt zwar den zuletzt gesendeten Zustand, aber wer zwei Ausgänge gleichzeitig führt, kann hinterher nicht sagen, welcher gewonnen hat.<br><b>Zu #8:</b> Die Begrenzung der Sperre gibt es im Plugin bereits. Der Baustein hier ist die zweite Sicherung in Loxone — sie greift auch dann, wenn der LoxBerry selbst steht.<br><b>Zu #9:</b> Der Baustein, den man vergisst — und der wichtigste. Die vier SG-Ready-Ausgänge haben bewusst <b>keinen Aus-Befehl</b>: jeder sendet nur, wenn er auf 1 geht. Ohne #9 fährt die Anlage über #7 in den Anlauf oder über #8 in die Sperre und bleibt dort, weil niemand je den Normalbetrieb sendet. Die Haltezeit in #8 hilft dabei nicht: sie beendet die Sperre in Loxone, nicht in der Wärmepumpe."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE = "Im Reiter <i>Test</i> auf <i>Statuszeile holen</i> drücken und die Zahlen mit denen in der Hersteller-App vergleichen. Stimmen sie, danach in Loxone Config den virtuellen Eingang öffnen — dort muss dieselbe Zeile stehen. Erst dann die Bausteine verdrahten."

