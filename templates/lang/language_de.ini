[DURCHSAGE]
H = "Ansagen (Sprachausgabe, ab Werk aus)"
TEXT = "Ein weiterer Meldeweg neben Loxone und MQTT: Das Plugin sagt bis zu drei Ereignisse über die gemeinsame Sprachausgabe der Plugins dieses Hauses an – über den Loxone Music Server, MusicServer4Home, eine eigene Adressvorlage, Alexa-NG oder Google-Lautsprecher (Chromecast 4 Lox NG). Angesagt wird der Beginn eines Ereignisses, einmal, höchstens eine Ansage je Ereignis und Stunde; Werte werden nie angesagt. Gesprochen wird aus dem Minutentakt nach dem Abruf, die übrigen Meldewege bleiben unverändert. Adresse und Vorlage müssen im Heimnetz liegen. Ab Werk aus."
L_ANLAESSE = "Anzusagende Ereignisse"
L_ANMELDUNG = "Die Herstellercloud weist die Anmeldung ab (Anmeldung abgelaufen oder Zugangsdaten abgelehnt)"
L_AUSFALL = "Seit mehr als %d Minuten keine Werte (Herstellercloud oder Gateway nicht erreichbar)"
H_ANLAESSE = "Jedes Ereignis lässt sich einzeln abwählen, wirksam erst mit einer Ausgabeart unten. Ein einzelner misslungener Abruf ist kein Ausfall: angesagt wird erst, wenn seit dem letzten Erfolg mindestens 30 Minuten (oder das Dreifache des Abruftakts) vergangen sind und mindestens zwei Abrufe in Folge scheiterten. Ein Netzfehler beim Anmelden zählt nicht als Abweisung. Eine Störung der Wärmepumpe sagt das Plugin nur bei myVAILLANT an: dort fragt es nach jedem gelungenen Abruf die Liste der Diagnosecodes ab (nur mit gewählter Ausgabeart und Haken) und sagt die Anzahl an, sobald die Liste nicht mehr leer ist. Die übrigen Hersteller liefern dem Plugin keinen Fehlercode."
TEXT_ANMELDUNG = "Wärmepumpe: Die Herstellercloud hat die Anmeldung abgewiesen. Bitte im Plugin neu anmelden."
TEXT_AUSFALL = "Wärmepumpe: Seit %d Minuten kommen keine Werte von der Wärmepumpe."
L_STOERUNG = "Die Wärmepumpe meldet eine Störung (nur myVAILLANT: Liste der Diagnosecodes nicht leer)"
