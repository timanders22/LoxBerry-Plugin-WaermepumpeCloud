; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "This plugin connects the <b>manufacturer's own cloud</b> of modern heat pumps and translates <b>SG Ready states</b> from Loxone into it. Intended for systems without a Modbus module, where only the manufacturer's Wi-Fi module is fitted."
K02 = "<b>Supported:</b> myUplink (Nibe), Daikin Onecta, MELCloud (Mitsubishi Electric), myVAILLANT (Vaillant, Saunier Duval, Bulex, Glow-worm, DemirDöküm) and EMS-ESP (Bosch, Buderus, Junkers, Nefit, Worcester, Sieger). The first four go through the vendor cloud, the last one through a gateway on your own network."
K03 = "<b>Order of setup:</b>"
K04 = "<i>Settings</i> → choose the manufacturer. The table above it says what you are letting yourself in for with each of the three."
K05 = "Enter the credentials. With myUplink and Daikin these are the ID and secret of an application of your own that you create in the manufacturer's developer portal. With MELCloud and myVAILLANT they are the e-mail address and password of the account."
K06 = "With myVAILLANT additionally choose <b>brand and country</b>. Together they determine the login realm; the wrong country does not report a wrong password but an unknown account."
K07 = "With Daikin additionally the one-off sign-in through the browser."
K08 = "<i>Test</i> → <b>Search for devices</b>, copy the identifier into <i>Settings</i> and save."
K09 = "<i>Test</i> → <b>Fetch now</b>, then <b>Show field paths</b>."
K10 = "<i>SG Ready</i> → look at what the four states actually do with this manufacturer."
K11 = "<i>MQTT</i> → enter the subscription in the gateway."
K12 = "<i>Loxone integration</i> → download the templates and import them into Loxone Config."
K13 = "myVAILLANT"
K14 = "<b>No open interface.</b> Sign-in uses the credentials of the app. Everything about it comes from the open-source library <span class='sm-mono'>myPyllant</span> — nothing is guesswork, but Vaillant can change it at any time. Where possible: create a second account with sharing in the app and use that one here."
K15 = "<b>The hot water circuit is numbered from 255</b>, not from 0. If hot water boosting has no effect, that index is the first suspect."
K16 = "<b>Boosting works through the quick deviation</b>, not through the manual set point — it expires by itself. If the Miniserver hangs, the system falls back on its own after the set time."
K17 = "<b>Blocking does not happen.</b> State 1 only ends a running boost. The system could be switched off, but <i>off</i> is not a utility block. If you really want to block, use the two terminals on the appliance."
K18 = "<b>Coefficient of performance</b> from the energy meters: heat delivered divided by electricity consumed. If the system supplies only one of the two series, <b>nothing</b> is calculated — the reason appears on the Settings tab."
K19 = "<b>Three things to know beforehand:</b>"
K20 = "<b>myUplink:</b> reading is free, <b>writing requires a paid subscription</b>. Without one the interface answers a switching command with a refusal — the plugin reports that specifically."
K21 = "<b>Daikin Onecta:</b> <b>200 calls per day.</b> The polling interval is therefore derived from that budget, not chosen freely."
K22 = "<b>MELCloud:</b> unofficial, may change at any time. <b>Minimum interval 180 seconds</b> — ask more often and you are locked out for hours."
K23 = "<b>Real SG Ready only exists with Nibe.</b> Everywhere else it is emulated: „block“ there simply means <i>off</i>, and <i>off</i> is not the same as the utility block a heat pump knows itself. With EMS-ESP two relays on the gateway can drive the real terminal pattern. The <i>SG Ready</i> tab states for each state exactly what happens."
K24 = "<b>If a value is missing:</b> the plugin tries several paths per field and states on the <i>Test</i> tab which one worked. If the value is in the raw reply but not in the table, it can be mapped by hand at the bottom of that tab."
K25 = "EMS-ESP (Bosch, Buderus, Junkers, Nefit, Worcester)"
K26 = "<b>No cloud.</b> Between the plugin and the heat pump sits a gateway on the EMS bus, usually one from BBQKees running the free EMS-ESP firmware. It lives on your own network: no account, no rate limit, no vendor who can switch the interface off."
K27 = "<b>A Bosch heat pump reports itself as <span class='sm-mono'>boiler</span></b>, not as <span class='sm-mono'>heatpump</span> — that name belongs to a different module. Anyone looking there finds nothing and blames the gateway."
K28 = "<b>Reading needs nothing, writing needs an access token.</b> Get it from the gateway web interface under <i>Settings → Security → Manage Users</i> for the user with admin rights. It does not expire."
K29 = "<b>SG Ready cannot be set over the bus.</b> The gateway can only <i>read</i> terminals 1 and 4 of the heat pump. The emulation switches heating off, or raises the room temperature, instead. For the real terminals you need two relays on the gateway GPIO — the gateway manufacturer explicitly advises caution."
K30 = "<b>Coefficient of performance:</b> the newer models keep <span class='sm-mono'>nrgtotal</span> (heat produced) and <span class='sm-mono'>metertotal</span> (electricity used) as lifetime meters. The plugin records a reading every hour and derives the coefficient from the difference over the configured period — not from the lifetime totals, which barely move."
