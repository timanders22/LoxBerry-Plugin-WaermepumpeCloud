; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dieses Plugin bindet die <b>herstellereigene Cloud</b> moderner Wärmepumpen an und übersetzt <b>SG-Ready-Zustände</b> aus Loxone dorthin. Gedacht für Anlagen ohne Modbus-Modul, bei denen nur das WLAN-Modul des Herstellers verbaut ist."
K02 = "<b>Unterstützt:</b> myUplink (Nibe), Daikin Onecta, MELCloud (Mitsubishi Electric), myVAILLANT (Vaillant, Saunier Duval, Bulex, Glow-worm, DemirDöküm)."
K03 = "<b>Reihenfolge beim Einrichten:</b>"
K04 = "<i>Einstellungen</i> → Hersteller wählen. Die Tabelle darüber sagt, worauf man sich bei jedem der drei einlässt."
K05 = "Zugangsdaten eintragen. Bei myUplink und Daikin sind das Kennung und Geheimnis einer eigenen Anwendung, die man im Entwicklerportal des Herstellers anlegt. Bei MELCloud und myVAILLANT sind es E-Mail und Passwort des Kontos."
K06 = "Bei myVAILLANT zusätzlich <b>Marke und Land</b> wählen. Beides zusammen bestimmt den Anmeldebereich; ein falsches Land meldet kein falsches Passwort, sondern ein unbekanntes Konto."
K07 = "Bei Daikin zusätzlich die einmalige Anmeldung über den Browser."
K08 = "<i>Test</i> → <b>Geräte suchen</b>, die Kennung nach <i>Einstellungen</i> übernehmen und speichern."
K09 = "<i>Test</i> → <b>Jetzt abrufen</b>, dann <b>Feldwege zeigen</b>."
K10 = "<i>SG Ready</i> → ansehen, was die vier Zustände bei diesem Hersteller tatsächlich bewirken."
K11 = "<i>MQTT</i> → das Abo ins Gateway eintragen."
K12 = "<i>Einbindung in Loxone</i> → Vorlagen herunterladen und in Loxone Config einlesen."
K13 = "myVAILLANT"
K14 = "<b>Keine offene Schnittstelle.</b> Angemeldet wird mit den Zugangsdaten der App. Alles dazu stammt aus der quelloffenen Bibliothek <span class='sm-mono'>myPyllant</span> — nichts ist geraten, aber Vaillant kann es jederzeit ändern. Wenn möglich: in der App ein zweites Konto mit Freigabe anlegen und dieses hinterlegen."
K15 = "<b>Der Warmwasserkreis zählt ab 255</b>, nicht ab 0. Bleibt die Warmwasser-Aufheizung wirkungslos, ist dieser Index der erste Verdächtige."
K16 = "<b>Angehoben wird über die Schnellabweichung</b>, nicht über den Handbetriebs-Sollwert — sie läuft von selbst ab. Bleibt der Miniserver hängen, fällt die Anlage nach der eingestellten Zeit von allein zurück."
K17 = "<b>Gesperrt wird nicht.</b> Zustand 1 beendet nur eine laufende Anhebung. Die Anlage liesse sich zwar ausschalten, aber <i>aus</i> ist keine EVU-Sperre. Wer wirklich sperren will, nimmt die beiden Klemmen am Gerät."
K18 = "<b>Arbeitszahl</b> aus den Energiezählern: abgegebene Wärme geteilt durch aufgenommenen Strom. Liefert die Anlage nur eine der beiden Reihen, wird <b>nichts</b> gerechnet — der Grund steht im Reiter Einstellungen."
K19 = "<b>Drei Dinge, die vorher zu wissen sind:</b>"
K20 = "<b>myUplink:</b> Lesen ist frei, <b>Schreiben verlangt ein kostenpflichtiges Abo</b>. Ohne Abo antwortet die Schnittstelle beim Schalten mit einer Ablehnung — das Plugin meldet das eigens."
K21 = "<b>Daikin Onecta:</b> <b>200 Aufrufe je Tag.</b> Der Abruftakt wird deshalb aus dem Budget gerechnet, nicht frei gewählt."
K22 = "<b>MELCloud:</b> inoffiziell, kann sich jederzeit ändern. <b>Mindesttakt 180 Sekunden</b> — wer häufiger fragt, wird für Stunden ausgesperrt."
K23 = "<b>Echtes SG Ready gibt es nur bei Nibe.</b> Bei Daikin und Mitsubishi wird es nachgebildet: „Sperre“ heißt dort schlicht <i>aus</i>, und <i>aus</i> ist nicht dasselbe wie die EVU-Sperre, die eine Wärmepumpe selbst kennt. Der Reiter <i>SG Ready</i> sagt je Zustand, was genau geschieht."
K24 = "<b>Wenn ein Wert fehlt:</b> Das Plugin probiert je Feld mehrere Pfade durch und sagt im Reiter <i>Test</i>, welcher gegriffen hat. Steht der Wert in der Rohantwort, aber nicht in der Tabelle, lässt er sich dort unten von Hand zuordnen."
